name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# No secrets are configured and no provider is ever called: the tests run against a local
# mock server, and the freeze check only recomputes checksums.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -r requirements.txt
      - name: tests
        working-directory: environment
        run: python -m pytest tests -q
      - name: the harness starts
        working-directory: environment
        run: python harness.py --help
      - name: the frozen evidence reproduces
        working-directory: environment
        run: python verify_freeze.py ../evidence/TP-gpt-5-r1-20260909-1443.freeze.json ../evidence/first-counted-purchase
